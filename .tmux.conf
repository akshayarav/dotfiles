# Unbind the default default leader key (Ctrl+b)
unbind C-b

# Set the new leader key to Ctrl+Space
set -g prefix C-Space

# Allow sending Ctrl+Space to other apps inside tmux by pressing it twice
bind C-Space send-prefix

# Enable mouse support for selecting text
set -g mouse on

# Use system clipboard inside tmux copy-mode (Mac pbcopy integration)
set -g set-clipboard on

# Vim-style copy mode bindings (optional but recommended)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Use Vim keybindings in copy mode
set-option -g mode-keys vi

# Map Leader + Escape to enter copy/visual mode
bind Escape copy-mode

# True color: pass 24-bit color through to the outer terminal
set -as terminal-features ',xterm*:RGB'

# Claude Code: let notifications reach the outer terminal, and distinguish Shift+Enter from Enter
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
