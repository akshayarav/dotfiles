# Unbind the default default leader key (Ctrl+b)
unbind C-b

# Set the new leader key to Ctrl+Space
set -g prefix C-Space

# Allow sending Ctrl+Space to other apps inside tmux by pressing it twice
bind C-Space send-prefix

# Enable mouse support for selecting text
set -g mouse on

# Use system clipboard inside tmux copy-mode (Mac pbcopy integration)
set -g set-clipboard on

# Apps setting the clipboard via OSC 52 (e.g. nvim yanks in devcontainers) land in a tmux buffer,
# but tmux doesn't reliably forward them to iTerm2, so copy the new buffer to the Mac clipboard directly
set-hook -g pane-set-clipboard 'run-shell -b "tmux save-buffer - | pbcopy"'

# Vim-style copy mode bindings (optional but recommended)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Use Vim keybindings in copy mode
set-option -g mode-keys vi

# Map Leader + Escape to enter copy/visual mode
bind Escape copy-mode

# True color: pass 24-bit color through to the outer terminal
set -as terminal-features ',xterm*:RGB'

# Claude Code: let notifications reach the outer terminal, and distinguish Shift+Enter from Enter
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Keep more scrollback for long outputs (default is 2000 lines)
set -g history-limit 50000

# Plugins via TPM (prefix + I installs, prefix + U updates)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'

# tmux-fingers: vimium-style hints to copy URLs, paths, hashes (prefix + Space)
set -g @fingers-key Space

# Keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
